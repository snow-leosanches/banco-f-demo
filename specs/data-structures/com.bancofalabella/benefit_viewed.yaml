# yaml-language-server: $schema=https://raw.githubusercontent.com/snowplow/snowplow-cli/refs/heads/main/internal/validation/schema/data-structure.json

apiVersion: v1
resourceType: data-structure
meta:
  hidden: false
  schemaType: event
  customData: {}
data:
  $schema: http://iglucentral.com/schemas/com.snowplowanalytics.self-desc/schema/jsonschema/1-0-0#
  self:
    vendor: com.bancofalabella
    name: benefit_viewed
    format: jsonschema
    version: 1-0-0
  type: object
  description: Fired when the customer opens a benefit detail page.
  properties:
    benefit_id:
      description: Catalog identifier for the benefit
      type: string
      maxLength: 64
    merchant:
      description: Merchant name
      type: string
      maxLength: 128
    category:
      description: Benefit category
      type: string
      enum:
        - Restaurantes
        - Viajes
        - Combustible
        - Retail
    discount_pct:
      description: Discount percentage
      type: integer
      minimum: 0
      maximum: 100
  required:
    - benefit_id
    - merchant
    - category
    - discount_pct
  additionalProperties: false
